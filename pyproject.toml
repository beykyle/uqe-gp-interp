[project]
name = "gp-interp"
version = "0.1.0"
description = "Gaussian process interpolation notebook"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "jupyter",
]

[tool.uv]
package = false

# Lets `pip install .` install the dependencies; there is no Python package to ship.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
